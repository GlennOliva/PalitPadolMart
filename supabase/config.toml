# PalitPaddleBai Mart — Supabase local development configuration.
#
# Generated as part of Phase 0 project scaffolding. When the Supabase CLI
# becomes available, run `supabase init` / `supabase link` to reconcile this
# file and connect a live project.

project_id = "palitpaddlebai-mart"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[analytics]
enabled = true
port = 54327
vector_port = 54328

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "52428800"
